# Offline gazetteer used by the rules parser (app/domain/parser_rules.py) to spot city and neighbourhood
# names in free text and to bias baseline place searches towards a neighbourhood.
#
# It is NOT the geocoder: resolve_location still asks Open-Meteo (or the fixture geocoder) for the
# authoritative Location. Coordinates are approximate centre points (public geographic facts, rounded to
# 4 decimals), good enough for a search bias and a 40 km sanity check, not for routing.
#
# Format:
#   <Canonical city name>:
#     country_code: ISO 3166-1 alpha-2 (currency comes from countries.yaml)
#     timezone:     IANA timezone
#     lat, lng:     approximate city centre
#     aliases:      other spellings. All-caps acronyms (BLR, NYC, SF, LA, HSR) only match when typed in
#                   capitals, so "la" or "cp" in ordinary text never matches. Everything else is matched
#                   case-insensitively on word boundaries.
#     neighbourhoods:
#       <Canonical neighbourhood>: {lat, lng, aliases: [...]}
#
# Deliberately left out: names that are common English words or brands (Nice, Reading, Bath, Phoenix,
# Fort) because they would produce false matches in free text.

