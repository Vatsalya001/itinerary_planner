# ISO 3166-1 alpha-2 -> ISO 4217 currency and display symbol (shown before the amount). Every country in
# gazetteer.yaml is listed (tests/providers/test_normalize.py checks it). Countries not listed have no default
# currency, so a bare budget number triggers a clarification. Where the usual symbol is ambiguous or written after
# the amount (kr, Kč, Rs, Fr.), the ISO code is used as the prefix instead. Checked 2026-11-02 (see SOURCES.md).
IN: {currency: INR, symbol: "₹"}
GB: {currency: GBP, symbol: "£"}
US: {currency: USD, symbol: "$"}
AE: {currency: AED, symbol: "AED "}
SG: {currency: SGD, symbol: "S$"}
DE: {currency: EUR, symbol: "€"}
