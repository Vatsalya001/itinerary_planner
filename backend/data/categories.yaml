# Canonical place categories. Every provider maps its own types onto these keys.
#
# group:     food | drinks | outdoors | culture | shopping | entertainment | wellness | event
# meal:      true if a visit counts as a sit-down meal (must_include:sit_down_meal)
# indoor:    true/false; used for weather, setting constraints and Plan B
# seated:    the visitor mostly sits (counts toward the low-energy "seated stop" rule)
# effort:    low | medium | high physical effort
# walking:   true if the visit itself is mostly walking (counts toward the pacing walking budget)
# duration:  [min, default, max] minutes for a visit
# alcohol:   true if the venue's main purpose is alcohol (excluded by alcohol:avoid)
# cost_inr:  [min, max] per-person category default in INR when a provider gives no price
# tags:      interest tags this category satisfies
# busy:      typical Saturday busy windows in local minutes (heuristic, used with popularity)

