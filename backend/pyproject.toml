[project]
name = "saturday-planner"
version = "0.1.0"
description = "Perfect Saturday Planner: a LangGraph agent that plans a realistic Saturday from real places, weather and events"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.11",
    "pydantic-settings>=2.16",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "tzdata>=2026.1",
    "langgraph>=1.2.19",
    "langchain>=1.4.7",
    "langchain-core>=1.7.3",
    "langchain-anthropic>=1.7.7",
    "langchain-google-genai>=4.4.2",
    "langchain-xai>=1.3.0",
    "langchain-ollama>=1.1.0",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3",
    "langsmith>=0.14",
    "sentry-sdk[fastapi]>=2.73",
    "langchain-groq>=1.1.3",
    "langchain-cerebras>=0.8.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.4",
    "respx>=0.23",
    "ruff>=0.14",
    "mypy>=1.18",
    "types-PyYAML",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: needs network or API keys; skipped unless RUN_LIVE=1",
    "ollama: needs a local Ollama server with the model pulled; skipped unless RUN_OLLAMA=1",
]
addopts = "-q -m 'not live and not ollama'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.uv]
package = false
