# Model registry (IMPLEMENTATION_PLAN.md section 8). Switching models is configuration, not code.
#
# kind:     api | local | fake | baseline
# params:   provider constructor settings (see app/llm/registry.py for the per-provider rules)
# pricing_per_mtok: USD per million tokens; local, fake and baseline rows cost 0
# timeouts: agent_turn_s caps one agent model call; parse_s caps the structured-output parse call
# params.structured_output: json_schema (default; always used for Anthropic) | function_calling
# params.num_predict (Ollama): output-token cap per call; without it small models can generate for minutes
# params.rate_limit: {requests, window_s} client-side sliding window per model, shared by all runs in a process
# pending:  true until a real model ID is pinned; requesting it raises PendingModelError
production:
  primary: cerebras:gpt-oss-120b
  fallback: groq:openai/gpt-oss-120b  # used when Cerebras errors, rate-limits or times out; then the rule-based planner

timeouts:
  api: {agent_turn_s: 45, parse_s: 15}
  local: {agent_turn_s: 150, parse_s: 25}  # parse falls back to rules quickly; turns keep the time
  fake: {agent_turn_s: 45, parse_s: 15}
  baseline: {agent_turn_s: 0, parse_s: 0}

candidates:
  - id: google_genai:gemini-3.6-flash
    kind: api
    note: >-
      Optional, not used in production. On 2026-11-03 gemini-3.8-flash returned 503/504 "high demand" on every
      try and 3.6 failed mid-run with 503s, so the deployment uses Groq only. 3.6 is deprecated (no shutdown
      date). Default temperature (Gemini 3+ guidance).
    params:
      max_tokens: 8192
      max_retries: 3  # transient 503 "high demand" responses are common; the agent-turn timeout bounds the wait
      request_timeout_s: 60
    pricing_per_mtok: {input: 0.75, output: 3.75, cache_read: 0.075}  # paid tier, through 2026-12-31

  - id: google_genai:gemini-3.8-flash
    kind: api
    note: >-
      Google's current Flash (2026-11-03). Candidate to replace 3.6 as primary; it was overloaded (503/504) when
      pinned. gemini-2.5-flash and gemini-3.5-flash are deprecated and reroute to other models.
    params:
      max_tokens: 8192
      max_retries: 1
      request_timeout_s: 60
    pricing_per_mtok: {input: 0.75, output: 3.75, cache_read: 0.075}  # paid tier, through 2026-12-31

  - id: cerebras:gpt-oss-120b
    kind: api
    note: >-
      Production primary (Cerebras). Free Trial (card on file, $5 credit for 30 days, no charge until credits
      are bought): 5 RPM, 30K uncached / 90K total TPM, 1M tokens per hour and per day. Built with ChatCerebras
      directly (init_chat_model has no cerebras provider). Pricing is the free-trial credit, recorded as 0 here.
    max_agent_turns: 4  # with the parse call, a plan stays within the 5-requests-per-minute window
    params:
      temperature: 0
      max_tokens: 8192
      rate_limit: {requests: 5, window_s: 60}  # trial: 5 requests per ROLLING minute (6th gets 429)
      max_retries: 0  # a 429 (5 RPM on the trial) goes straight to the Groq fallback instead of retrying
      request_timeout_s: 60
      reasoning_effort: {parse: low, agent: medium, judge: medium}
    pricing_per_mtok: {input: 0, output: 0}

  - id: groq:openai/gpt-oss-120b
    kind: api
    note: >-
      Production fallback (Groq). Free tier limits for this model: 30 RPM, 8K TPM, 200K tokens/day, so a full
      eval or real traffic needs Groq's paid (Developer) tier. Reasoning is hidden from the response.
    params:
      temperature: 0
      max_tokens: 8192
      rate_limit: {requests: 30, window_s: 60}  # free tier request limit (token limits are not modelled)
      max_retries: 1
      request_timeout_s: 60
      reasoning_effort: {parse: low, agent: medium, judge: medium}
      reasoning_format: hidden
    pricing_per_mtok: {input: 0.15, output: 0.60}

  - id: anthropic:claude-opus-5-5
    kind: api
    note: Optional (not configured for this deployment). Thinking is always on; depth is set with output_config.effort.
    params:
      max_tokens: 16000  # leaves room for thinking
      effort: {parse: low, agent: medium, judge: medium}
      max_retries: 1  # the run deadline, not SDK retries, bounds latency
      request_timeout_s: 60
      cache_system_prompt: true  # cache_control on the static system prompt block
      betas: [server-side-fallback-2026-07-01]
      server_side_fallback: default  # request field `fallbacks: "default"` (refusal fallback)
    pricing_per_mtok: {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}

  - id: xai:<pending>
    kind: api
    pending: true
    note: Optional, not configured (no xAI key). Pin an ID here if xAI is ever added.
    params: {temperature: 0, max_tokens: 8192}
    pricing_per_mtok: {input: 0, output: 0}

  - id: ollama:qwen3.5:9b
    kind: local
    note: Local, eval/dev only.
    # Ollama answers 501 "structured output is unavailable" for format=<schema> on this model; tool-call
    # based structured output works.
    params: {num_ctx: 32768, num_predict: 2048, temperature: 0, keep_alive: 10m, reasoning: false,
             structured_output: function_calling}
    pricing_per_mtok: {input: 0, output: 0}

  - id: ollama:gemma4:e4b
    kind: local
    note: Local, eval/dev only.
    params: {num_ctx: 32768, num_predict: 2048, temperature: 0, keep_alive: 10m, reasoning: false,
             structured_output: function_calling}
    pricing_per_mtok: {input: 0, output: 0}

  - id: ollama:granite4:tiny-h
    kind: local
    note: Local, eval/dev only. No thinking mode, so `reasoning` is left unset.
    params: {num_ctx: 32768, num_predict: 2048, temperature: 0, keep_alive: 10m, reasoning: null}
    pricing_per_mtok: {input: 0, output: 0}

  - id: fake:agent
    kind: fake
    note: Scripted offline model (app/llm/fake.py). Behaviour faults come from settings.fault.
    pricing_per_mtok: {input: 0, output: 0}

  - id: fake:secondary
    kind: fake
    note: Scripted offline model used as the second provider in fallback-chain tests.
    pricing_per_mtok: {input: 0, output: 0}

  - id: fake:primary_503
    kind: fake
    note: Scripted model that always fails like an HTTP 503 (exercises with_fallbacks).
    pricing_per_mtok: {input: 0, output: 0}

  - id: baseline:deterministic
    kind: baseline
    note: No LLM. Rules parser plus the deterministic planner.
    pricing_per_mtok: {input: 0, output: 0}
